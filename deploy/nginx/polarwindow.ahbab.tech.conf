# POLAR WINDOW at https://polarwindow.ahbab.tech: the nginx site on the VM's host.
#
# Install (docs/deploy-gcp.md, stage 9), only once the certificate exists:
#   sudo cp deploy/nginx/polarwindow.ahbab.tech.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/polarwindow.ahbab.tech.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This nginx holds the TLS certificate and is the only thing open to the internet.
# Behind it, on this machine only (docker-compose.yml with the .env from
# deploy/env.production.example):
#   127.0.0.1:8080  the `web` container: the built dashboard (PW_WEB_ADDR, PW_WEB_PORT)
#   127.0.0.1:8000  the `api` container: FastAPI (PW_BIND_ADDR)
# /api/ and /healthz go straight to the api, so the api sees the visitor's address in
# X-Forwarded-For (set here, never appended) and its limits count per visitor. The api
# believes that header because .env sets PW_FORWARDED_ALLOW_IPS=*; nothing outside
# this machine can reach port 8000.
#
# Written for Ubuntu 24.04's nginx 1.24 (`listen ... ssl http2`).

# Requests per visitor to /api/. The api limits only writes (backend/app/api/limits.py)
# and never reads, yet some reads start a compute job or compute on the request. A map
# screen fetches its tiles in a burst, so the burst is wide; a flood is not.
limit_req_zone $binary_remote_addr zone=pw_api:10m rate=20r/s;

upstream pw_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream pw_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Port 80: the certificate's challenge files, and everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name polarwindow.ahbab.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Any other name (the bare IP address, scanners): no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name polarwindow.ahbab.tech;

    ssl_certificate     /etc/letsencrypt/live/polarwindow.ahbab.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polarwindow.ahbab.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pw_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # .dev is on the browsers' HSTS preload list already; this says the same.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Every body except the intake file is refused by the api past 64 KB anyway
    # (PW_MAX_BODY_BYTES); the intake file may be 8 MB (PW_MAX_UPLOAD_BYTES), so a
    # little more than that reaches the api, which answers past 8 MB in its own words.
    client_max_body_size 1m;

    location /api/ {
        limit_req zone=pw_api burst=200 nodelay;
        limit_req_status 429;
        client_max_body_size 9m;

        proxy_pass http://pw_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        # The longest request: reading a dropped project file, which gives the model up
        # to 70 s in all (backend/app/agents/intake.py, MODEL_BUDGET_S). Ask stops at
        # 20 s (PW_AGENT_TIMEOUT_S). Heavy answers are jobs that are polled, never held
        # open, and nothing streams. 120 s is the same as frontend/nginx.conf.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://pw_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    # The pages, their files and the front page's films. The web container sets the
    # caching headers (frontend/nginx.conf) and answers byte ranges for the films.
    location / {
        proxy_pass http://pw_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
