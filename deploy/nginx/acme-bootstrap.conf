# POLAR WINDOW: the nginx site used once, to get the first certificate.
#
# The site is served only over HTTPS, so nothing is shown before the certificate
# exists. This file serves Let's Encrypt's challenge files on port 80 and nothing
# else. docs/deploy-gcp.md, stage 9:
#   sudo cp deploy/nginx/acme-bootstrap.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/acme-bootstrap.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d polarwindow.ahbab.tech ...
# then it is removed and polarwindow.ahbab.tech.conf takes its place (that file
# keeps the same challenge location, so renewals work the same way).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name polarwindow.ahbab.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
