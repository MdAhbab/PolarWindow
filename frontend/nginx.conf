# POLAR WINDOW behind one address: the built pages, and the API passed through.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json
               application/problem+json image/svg+xml;

    # The API and its health check. The address the request came from is set here,
    # not appended to what the client sent, so the API's limits per address cannot
    # be dodged with a forged header.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Built files carry a hash in their names: keep them a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The saved answers are files; a missing one is a 404, never the app's page.
    location /snapshot/ {
        try_files $uri =404;
    }

    # Every other address is a page of the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
